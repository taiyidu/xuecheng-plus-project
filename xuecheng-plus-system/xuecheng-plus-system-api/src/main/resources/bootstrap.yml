#微服务配置
spring:
  application:
    name: system-api
  cloud:
    nacos:
      server-addr: localhost:8848
      discovery:
        namespace: dev
        group: xuecheng-plus-project
      config:
        namespace: dev
        group: xuecheng-plus-project
        file-extension: yaml
        refresh-enabled: true
        # 共享配置数组
        shared-configs:
          - data-id: mysql.yaml
            group: xuecheng-plus-project
            refresh: true  # 开启动态刷新，nacos改配置不用重启项目
          - data-id: log.yaml
            group: xuecheng-plus-project
            refresh: true
